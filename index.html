<style>
    #overlay{
    position:fixed;
    inset: 0;
    background:rgba(0,0,0,.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: zoom-out;
}
#bigImage
{
    max-width: 90%;
    max-height: 90%;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,.8);
    animation:zoom .3s ease;
}
@keyframes zoom{
    from{
        transform: scale(0.8);
        opacity:0;
    }
    to{
        transform: scale(1);
        opacity:1;
    }
}
.overlay.show{
    display:block;
}
   body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(
        -45deg,
        #00b3ff,
        #ea00ff,
        #fbff00,
        #d21c1c
    );
    background-size:400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
} 
.myfam{
    width: 90%;
    margin: 100px auto;
    border: 5px solid red;
    overflow: hidden;
}

.myfam2{
    display: flex;
    gap: 15px;
    width: max-content;
    animation: scroll 20s linear infinite;
}

.myfam2 img{
    width: 300px;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid green;
}

@keyframes scroll{
    from{
        transform: translateX(0);
    }
    to{
        transform: translateX(-50%);
    }
}
.myfam:hover .myfam2{
    animation-play-state: paused;
}
.card
{
        height: 5em;
        padding: 1em;
        font-size: 3em;
        border-radius: 2em;
        text-align: center;
        align-items: center;


}
@keyframes slide{
    from{
        transform: translateX(0);
    }
    to{
        transform: translateX(50%);
    }
}
    .photo{
    cursor:pointer;
    transition:0.3s;
}

.photo:hover{
    transform:scale(1.05);
}

.photo.active{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(2);
    z-index:1000;
    max-width:80vw;
    max-height:80vh;
    width:auto;
    height:auto;
    border-radius:15px;
    box-shadow:0 0 50px rgba(0,0,0,.8);
}
.photo.active{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(2);
    z-index:99999;
    cursor:zoom-out;
}
.about{
    color: #000000;
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
}
.time{
    position: fixed;
    bottom: 10px;
    right:10px;
    font-family: 'Courier New', Courier, monospace;
}
.date{
    position: fixed;
    bottom: 10px;
    left:10px;
    font-family: 'Courier New', Courier, monospace;
}
</style>

        bigImage.src = photo.src;

        overlay.style.display = "flex";

});
